# Wersja na iPhone'a (PWA): buduje aplikację i publikuje ją na GitHub Pages.
# Jednorazowo: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Strona aplikacji (iPhone)

on:
  push:
    branches: [main, claude/shared-finance-calculator-app-gqltv8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
